<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Argus.Web</title>
	<base href="/" />
	<link rel="preload" id="webassembly" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
	<link href="_content/Blazorise/blazorise#[.{fingerprint}].css" rel="stylesheet" />
	<link href="_content/Blazorise.Material/blazorise.material#[.{fingerprint}].css" rel="stylesheet" />
	<link href="_content/Blazorise.Icons.Material/blazorise.icons.material#[.{fingerprint}].css" rel="stylesheet" />

	<link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
	<!-- If you add any scoped CSS files, uncomment the following to load them
	<link href="Argus.Web.styles.css" rel="stylesheet" /> -->
	<script type="importmap"></script>
</head>

<body>
<div id="app">
	<div class="app-startup">
		<div class="app-startup-shell" role="status" aria-label="Loading the application">
			<img src="images/logo.png" class="app-startup-logo" alt="" />
			<p class="app-startup-label">Preparing your workspace…</p>
			<div class="loading-progress"></div>
			<div class="app-startup-meta">
				<div class="loading-progress-text"></div>
			</div>
		</div>
	</div>
</div>

<div id="blazor-error-ui">
	An unhandled error has occurred.
	<a href="." class="reload">Reload</a>
	<span class="dismiss">🗙</span>
</div>
<script src="_content/Blazorise.Material/blazorise.material#[.{fingerprint}].js"></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
