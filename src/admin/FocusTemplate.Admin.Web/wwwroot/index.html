<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>FocusTemplate.Admin.Web</title>
	<base href="/" />
	<link rel="preload" id="webassembly" />
	<link rel="preload" href="_content/Radzen.Blazor/fonts/SourceSans3VF-Upright.ttf.woff2" as="font" type="font/woff2" crossorigin />

	<!-- Before the first paint: it sets <html data-theme> from the stored appearance or the system's scheme -->
	<script src="_content/FocusTemplate.Admin.Web.Foundation/appearance#[.{fingerprint}].js"></script>
	<script src="_content/FocusTemplate.Admin.Web.Foundation/culture#[.{fingerprint}].js"></script>
	<link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
	<!-- If you add any scoped CSS files, uncomment the following to load them
	<link href="FocusTemplate.Admin.Web.styles.css" rel="stylesheet" /> -->
	<script type="importmap"></script>
</head>

<body>
<div id="app">
	<div class="app-startup">
		<div class="app-startup-shell" role="status" aria-label="Loading the application" data-label="loading">
			<!-- The symbol scales into this box, so its viewBox holds the logo's proportions only -->
			<svg class="app-startup-logo" viewBox="0 0 428.85 94.76" aria-hidden="true" focusable="false">
				<use href="images/logo#[.{fingerprint}].svg#logo" />
			</svg>
			<p class="app-startup-label" data-text="preparing" data-testid="startup-label">Preparing your workspace…</p>
			<div class="loading-progress"></div>
			<div class="app-startup-meta">
				<div class="loading-progress-text"></div>
			</div>
		</div>
	</div>
</div>

<div id="blazor-error-ui">
	<span data-text="error">An unhandled error has occurred.</span>
	<a href="." class="reload" data-text="reload">Reload</a>
	<span class="dismiss">🗙</span>
</div>
<script>
	// Shown before .NET runs, so no resx reaches these texts. The language follows CultureStorage: the stored choice,
	// else the browser's, else English. A new language goes into Cultures.Supported and here.
	(() => {
		const texts = {
			en: {
				loading: "Loading the application",
				preparing: "Preparing your workspace…",
				error: "An unhandled error has occurred.",
				reload: "Reload",
			},
			de: {
				loading: "Die Anwendung wird geladen",
				preparing: "Ihr Arbeitsbereich wird vorbereitet …",
				error: "Ein unerwarteter Fehler ist aufgetreten.",
				reload: "Neu laden",
			},
		};

		const culture = window.culture?.read() ?? navigator.language;
		const language = culture.split("-")[0].toLowerCase();
		const text = texts[language] ?? texts.en;

		document.documentElement.lang = texts[language] ? culture : "en";
		document.querySelectorAll("[data-text]").forEach(element => element.textContent = text[element.dataset.text]);
		document.querySelectorAll("[data-label]").forEach(element => element.setAttribute("aria-label", text[element.dataset.label]));
	})();
</script>
<script src="_content/Radzen.Blazor/Radzen.Blazor#[.{fingerprint}].js"></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
