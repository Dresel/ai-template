emit:
  - "@typespec/openapi3"
  - "@spatialfocus/typespec-http-csharp-slim"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}"
    openapi-versions:
      - "3.2.0"
    file-type: yaml
    experimental-parameter-examples: data
    omit-unreachable-types: true
  "@spatialfocus/typespec-http-csharp-slim":
    emitter-output-dir: "{output-dir}"
    output-type: api
    library-namespace: SpatialFocus.Http
    generated-dir: "generated"
    api-namespace: "SpatialFocus.Weather.Api.{interface}"
    contracts-namespace: "SpatialFocus.Weather.Shared"
    validation: fluentvalidation